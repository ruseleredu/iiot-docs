# Câmara climática ESP32 simulada — roda SOZINHA (não precisa de Node-RED nem de mosquitto)
#
#   docker compose up -d --build                  # só o simulador
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d --build
#                                                 # + entra na rede do kit/LAB IoT
# Ajustes no arquivo .env (copie de .env.example).
name: camara-sim

services:
  camara-sim:
    build: .
    image: camara-sim:local
    container_name: ${GRUPO:-lab05-a}-camara      # mesmo nome de host do laboratório
    hostname: ${GRUPO:-lab05-a}-camara
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - GRUPO=${GRUPO:-lab05-a}                   # tópicos MQTT: <grupo>/camara/...
      - MQTT_HOST=${MQTT_HOST:-host.docker.internal}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - SIM_SPEED=${SIM_SPEED:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"       # broker no próprio PC (Linux também)
    ports:
      - "${PORTA_MODBUS_TCP:-502}:502"            # Modbus TCP
      - "${PORTA_MODBUS_RTU:-5021}:5021"          # Modbus RTU sobre TCP
      - "${PORTA_S7:-102}:102"                    # Siemens S7 (ISO-on-TCP)
      - "${PORTA_OPCUA:-4840}:4840"               # OPC-UA
