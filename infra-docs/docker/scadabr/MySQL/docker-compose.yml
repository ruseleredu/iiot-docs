name: scadabr

# ScadaBR 1.2 — http://localhost:8080/ScadaBR  (login: admin / admin)
#
#   docker compose up -d --build                 # ScadaBR + MySQL (default)
#   docker compose logs -f scadabr               # follow startup (first boot ~1 min)
#
# To use the embedded Derby database instead of MySQL, comment out the
# DB_* variables below, the `depends_on` block and the `mysql` service.

services:
  scadabr:
    build:
      context: .
      args:
        SCADABR_REF: master          # branch or tag of github.com/ScadaBR/ScadaBR
    image: scadabr:1.2
    container_name: scadabr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/Sao_Paulo
      DB_TYPE: mysql
      DB_URL: jdbc:mysql://mysql:3306/scadabr?useSSL=false&useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: scadabr
      DB_PASSWORD: ${MYSQL_PASSWORD:-scadabr}
      CATALINA_OPTS: -Xms256m -Xmx1024m -Djava.awt.headless=true
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - scadabr-data:/data
      - scadabr-uploads:/usr/local/tomcat/webapps/ScadaBR/uploads
      - scadabr-filedata:/usr/local/tomcat/webapps/ScadaBR/WEB-INF/filedata
      - scadabr-logs:/usr/local/tomcat/logs
    # Uncomment to give ScadaBR access to a serial port (Modbus RTU, etc.)
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  mysql:
    # ScadaBR ships MySQL Connector/J 5.1, which needs MySQL 5.x
    image: mysql:5.7
    platform: linux/amd64
    container_name: scadabr-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --lower-case-table-names=1
      - --max-allowed-packet=64M
      - --sql-mode=NO_ENGINE_SUBSTITUTION   # legacy schema predates strict mode
    environment:
      TZ: America/Sao_Paulo
      MYSQL_DATABASE: scadabr
      MYSQL_USER: scadabr
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scadabr}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  scadabr-data:
  scadabr-uploads:
  scadabr-filedata:
  scadabr-logs:
  mysql-data:
